name: wall-ci
on:
  push:
    paths: ["wall/**", ".github/workflows/wall-ci.yml"]
  pull_request:
    paths: ["wall/**", ".github/workflows/wall-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
